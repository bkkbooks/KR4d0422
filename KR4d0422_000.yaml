body:
  text: 藏春集别集類四元提要臣等謹案藏春集六卷元劉秉忠撰秉忠有玉尺經已著録秉忠博覽好學尤邃於易凡天文地理律厯三式六壬遁甲之屬無不精通故術數家言多托之以行世往往不可盡信至其所著文集見於本傳者十卷今此本祇六卷乃明處州知府馬偉所刋前五卷為各體詩末一卷附録誥敕志文行狀而不及所著雜文故秉忠所上萬言書及其他奏疏見於本傳者概闕焉蓋文已佚而僅存其詩故卷目多寡與本傳不合也秉忠起自緇流身參佐命與明道衍蹤迹頗同然道衍首搆逆謀獲罪名教而秉忠則乘時應運參贊經綸以典章禮樂為先務卒開一代治平其人品相去懸絶故所作大都平正通達無噍殺之音史稱其詩蕭散間淡類其為人雖推之稍過然如小詩中鳴鳩喚住西山雨桑葉如雲麥始花之類亦未嘗不時露風致也乾隆四十六年四月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀藏春集原序易曰觀乎天文以察時變觀乎人文以化成天下大哉文乎在天為日月之著明雲漢之昭回星辰之錯綜在人為三綱五常之道禮樂刑政之方典章法度之美文乎文乎章句云乎哉大傅文貞公學參天人思周變通早慕空寂脫棄世務一旦遭際聖主運應風雲契同魚水有若留侯規畫以興漢業召公相宅以營都邑叔孫奉常綿蕝以定朝儀陸賈詩書之語賈生仁義之説當雲霾草昧之世天開地闢贊成文明之治其諡曰文不亦宜乎至於裁雲鏤月之章陽春白雪之曲在公乃為餘事公歿後十有四年是集始行於世夫人竇氏暨其子璋介翰林待制王之綱求為敘引晚生愚陋誠不足知公萬一姑以時論所同然者附諸編末云至元丁亥四月初吉翰林學士太中大夫知制誥同修國史閻復序
