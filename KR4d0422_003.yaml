body:
  text: 藏春集卷三元劉秉忠撰七言律詩二月寄鄉友漠北燕南幾日程鴈來人去總飄零春隂將散好風至野燒漸空芳草生橋下洄澴鴛水緑城頭突兀鵲山青此情擬託新詩遣寫就新詩轉繫情春日遣懷蓋世功名一局棊千年城郭昔人非分開春色花休妬流盡年光水不知詩酒可娛惟自得林泉雖好幾人歸長繩不繫天邊日寄與東風且慢吹春晴曉望水漲池塘雨洗塵際空樓閣倚闌人星潛月落千山曉日暖風和萬物春何樹落花飄蕩逺誰家飛燕往來頻眼前盡是無聲句卻恐詩人道不真間中成物心存一寸丹行年半百鬢毛班鵷鴻眷眷期同列猿鶴顒顒怪未還懶性從來倦馳逐坦懷元不厭蕭間平生遊世東方朔金馬門中是隱仙溪亭小飲亭前桃李水邊樓與客攜壺慰倦遊眼底誰知花嫵媚人間惟有酒風流情元易感千生在愁不難消一醉休傳與京華年美少莫將白髮博封侯秋晚秋晚梧桐翠巳殘松風竹雨正珊珊功名果是將人誤懷抱惟除著酒寬一枕清風醒後覺滿軒明月卧中看乾坤裏許元無事間殺東山舊謝安寄友歸心搖蕩菊花期濁酒留連奈别離方外半生人事略天邊九月鴈書遲昨非今是翻然覺坎止流行斷不疑卻怪青春無柱杖滿頭白髮儘相欺答隘客坎蛙自蔽無餘地海若汪洋納百川士子行藏須達節人生貴賤定由天翰林自不拘吟放御史誰曽管醉顛萬事轉頭都是夢枉教愁擾轉頭前答鄉友人生終老覔莵裘白髮行藏獨倚樓南鴈縱能傳尺素西風不解送扁舟蒼山老樹煙波晚零雨疏松水墨秋願偃旌旗舞干羽功名輸與玉關侯倚樓倚樓雨霽暑風涼滿眼西山晚翠長書傳紛紛自今古漢唐亹亹有興亡一時王謝訐方略萬世伊周合廟堂致主澤民非我輩任人疑怪水雲鄉花時客至翠染新成楊栁絲紅粧爭簇海棠枝官身縱酒惟間日老眼看花勝少時好客一來深有幸曲巵滿勸不須辭晴明壯健相逢處莫負唐人七字詩嵗暮遣懷白首何從望省郎青春無伴共還鄉采薇縱廣飢終疾食肉非多智豈長半夜談天人寂寂明朝涉世事茫茫雪消咫尺春來到擬對芳華醉幾場慶王承旨慎獨八帙之壽白玉碑中第一人黃金殿下老朝臣富公同享八旬壽闕袖垂扶又倒家人轟笑醉歸來南北春秋鴈往來一年懷抱幾畨開風雲氣在元飄逸錦繡詩成不剪裁飲但飲人非飲酒憐須憐德亦憐才自因量窄常先醉慚愧君家大盞臺遣懷寄顔仲復二首名利場中名利兒寸心徒用惡尋思人才自有安排處物理寧無否泰時縱量傾殘一壺酒暢情吟殺七言詩詩成酒醉東風晚月照梨花第一枝朱顔白髮任流年睥睨揶揄置兩邊皆醉皆醒人豈爾一鳴一息物當然飛騰起處須從地智力窮時便到天惟有無生話無盡何如緘口坐癡禪寓桓州百年行止料皆難今是昨非豹一斑辜負夙心泉石畔纍垂短髮縉紳間夢回枕上聞歸鴈雨霽城中見逺山三徑就荒松菊在人生底事不能間思歸溪山幽境老情懷間著漁磯與嘯臺陶穀果然無相分翰林都道有仙才塵容俗狀今如此緑鬢朱顔安在哉會向桃源訪消息雲迷洞口沒人來山居曉起禪客生涯貴寂寥幸居山寺逺塵囂情難斷處千年在心肯間來萬事消新月看殘還舊月今朝過了任明朝須知元氣常流轉平旦無風自海潮晚遊山水清佳自在遊利名莫莫復休休瘦笻此日真忘世長笛何人效倚樓鴉落點成千樹墨鴈飛橫絶一天秋歸來小院松梢上新月低斜玉一鈎歸來昨非今是海漫漫蜀道容吾曳杖還數友偶成詩酒會一年不入縉紳班風吹栁葉先舒皺春窘桃花亦破硜但得樽前開口笑未為辜負此生間樓上睡起重持金曲巵要憑芳酒緩離思醉魂屢作還山夢吟興多因寄友詩千里波光風定後一樓山色雨晴時碧雲望斷佳人逺投樹棲鴉巳滿枝春暮有感殘花離樹酒盈巵但願春歸熟醉時楊栁隨風飄翡翠海棠和雨滴胭脂半生不定猶飛梗諸事無能強賦詩昨日溪邊間倚杖水明如鏡鬢如絲睡起連嵗驅馳萬里程碧臺歌舞笑爭名山中猿鶴丹心在塞上風煙白髮生對客倦談當世事向人難悉未歸情雪花亂打西窗急總似芭蕉夜雨聲捲簾煙籠碧草繞回溪水向東流日向西鴉隊落來和樹黑鴈行橫處與雲齊杯中有物甜如蜜心上無愁醉似泥蝸舍睡醒簾半捲逺山相擁翠環低遣懷世事茫茫今古同人生無奈落西東幾年羇旅鴈聲裏千里家鄉蝶夢中梧葉打殘秋夜雨菊花開盡曉晴風淵明醉卧東籬下不管明朝酒盎空銀河一道銀河萬里橫遙看似接鳳凰城晴波不受微雲點夜色還隨浩月明七夕橋成牛女會九秋霜降浪濤平歸途試問乘槎客卻到人間有幾程大理途中寄竇侍講先生二首昔聞名德仰髙山近識髙賢未敢攀富貴不求驚見擢田園成趣喜歸間一心止水常平湛萬事浮雲任往還解把陽和涵養就不言春色滿人間元氣勻將造化施自然間雅貴天資只言世上無黃石誰信人間有紫芝一見頓忘名利志劇談渾沒是非辭别來萬里知安否時復臨風有所思重看江上梅花萬里縱橫戈戟中嵗云暮矣遇芳叢江邊疏影斜斜月天外幽香細細風初見一枝珠琲瓃再看滿樹雪玲瓏無才不得西湖句空對氷容駐玉驄寄張平章仲一春光滿眼酒盈樽難得同觀易見分秋氣著人涼似水晚山和我淡如雲清歌月影簷頭轉殘夢鐘聲桃上聞玄鳥欲歸黃鳥斷詩哦伐木正思君野園會飲都城不得縱蹉跎樂事還於僻處多酒裏薰陶成受用胸中塊壘自消磨樹頭鳴鳥關關好花底春風淡淡和一卧醉鄉如洞府人間日月任飛梭暮春樓上松風竹雨夜珊珊睡起樓頭怯曉寒手裏酒杯隨接飲眼前書册懶拈看緑稠樹葉迷蝴蝶紅盡花枝放牡丹欲覔春歸無處問滿城飛絮憑欄干漫成上苑風光爛漫遊紫蘭黃菊各春秋一心不逐榮枯變萬事寧為得失憂充塞乾坤惟道在博通今古有書求慣曾澤畔翺翔雉莫謂楚籠不自由小飲清歡媚景好光隂自古猶難况在今坐下人多年漸老樽中酒滿興偏深將歌雪曲先傾耳疊泛霞杯足快心百嵗奔忙緣底事且拚一醉謝浮沈别友鸞鳳棲梧枳棘空車行步路有窮通九秋霜落樹無緑三月日回花自紅物態莫驚時冷暖人生還恨限西東一杯酒盡陽關曲萬疊雲山入望中寄友弟一别陽關金曲巵深秋節物動離思蝶飛籬畔菊開後鴈滿江頭楓落時才大難為鸚鵡賦情親易感鶺鴒詩願將村老真誠語寄謝悠悠世上兒思友人亂點蒼山壯地形西風白草動秋聲幾條野水馬爭飲一帶荒田人不耕蝸舍鴈程隨處客龍岡鴛水故園情關河月底人千里一夜相思白髮生田家衡門晝掩絶蕭騷粗糲充腸體布袍許泛壠頭甘自若陳登樓上對誰豪有田何必懸金印無犢還須賣寶刀青帝布恩先畎畝穀生如草雨如膏漁父撥棹垂竿日日同藕花叢了荻花叢朝雲暮雨間身外春水秋山醉眼中十里煙波明落日數聲漁笛響西風紅塵不到孤舟上誰得江湖伴此翁回杖逺山橫掃翠眉低春事關情鶯更啼䇿杖欲尋佳境去出門還被亂雲迷野花野草同三月間鷺間鷗共一溪沽酒歸來北窗下人間如夢醉如泥贈棲雲王真人壺內光風境界寬骨青髓緑發朱顔三生勘破人間夢九轉燒成日裏丹鶴馭不知天地闊鳳書還許水雲間隨緣應世元無事一片靈臺處處安再觀木庵書書法都歸篆意圓木庵别有筆中天一家楷式由來妙半世功名非偶然我欲窮源蒼頡上誰能得趣魯公前鰲山成道寧無日更為挑燈續斷篇臨蒼頡書落魄心情與世疏人皆知癖不知愚平生專究伏羲易漸老又臨蒼頡書但願自宗為法度不辭人笑費功夫他年變盡龍蛇體更看飛雲滿太虛重九後作地雄西北帝王州一月登髙未即休紅葉黃花空應節蒼山白草不勝酬寒風無意頻吹面破帽多情卻戀頭恰遇鄉人來送酒淵明不醉復何愁聞鴈織錦文章學不成更看斫句覔詩名黃花陟覺泣愁思白酒良能解宿酲月裏關河家正逺樓頭鼓角夢初驚尺書寫下還慵寄初動風前有鴈聲過并州山川滿目翠成圍流水悠悠鴈北飛一枕黃粱新夢斷千年華表昔人非煙霞有路迷芳草桃李無言對落暉明日征鞍泊何處春光雖好亦思歸自澤州過懷衛蔓澤南來過二州太行背腹得兼遊陷泥蹶馬十朝雨落葉粘人九月秋白日悠悠又西轉黃河滚滚只東流山林水竹行程裏是處都堪畫扇頭對酒秋水澄澄照影孤百年逆旅轉蘧廬聊生莫問鳩為計憶逺須憑鴈寄書北海鯨魚鈎巳重中州麟鳳網猶疏清愁萬丈干雲月著酒澆來自破除贈稿城董萬户老帥曾酬報國心遺君兄弟茂如林荆花一院長生色棠樹千年勿剪隂私物應官於巳薄家童代役感民深更能設藥除羣病四境誰非播德音感事萬物芒芒體一如只爭秉賦有精粗若非禮義人誰教又是詩書我更愚蜂蠆亦能摧猛士廟堂安敢悔樵漁愚夫愚婦豫能勝料必賢明見是圖贈完顔伯誠甫仲德之子也春風秋月透孤房恨殺關雎窈窕娘枯木岩前空積思散花天上不聞香生民世系來千古相國人家只一郎安可斷流同潦水合隨江漢入汪洋對菊啼殺前村棲後鴉黑頭江總早還家荆山玉定難同石麗水金元不在沙誰有才猷資國用自無勳業向人誇滿城風雨重陽近搖蕩歸心對菊花對月鶴髮貂裘映月波兔疑蟾戀竟如何絶知詩老丹心苦未信書生白眼多半夜香風飄桂子九秋寒色帶姮娥無人共竭樽中醁獨酌清光送浩歌新春城外青山懷抱古城隈楊栁梢黃海鴈回詩思不髙無好句酒腸雖窄有餘杯嶺頭寒盛雲猶雪爐內香消火巳灰為問名園起花手可將桃李強栽培過豐州二首平生清興在林泉世路誰教也著鞭馬上青山長萬里鏡中華髮巳三年又經黑水還沙漠才自烏雲出瘴煙蓋世功名正低首西風秋樹一聲蟬邊山瀰瀰水西流夾路離離禾黍稠出塞入塞動千里去年今年經兩秋晴空髙顯寺中塔曉日半明城上樓車馬駢闐塵不斷吟鞭斜裊過豐州雲內道中逺水平蕪間野花寒雲淡淡際寒沙間禽向晚無投樹逺客逢秋空念家萬里經年走風雨一身無計卧煙霞來朝又上居延道懷古思鄉改鬢華過東勝秋山漠漠晚煙橫牢落關河鴈一聲鐘鼎無媒希望斷江湖有志利名輕皇天不弔衣冠絶神物還從臭腐生慘淡風雲會銀夏短衣匹馬過邊城過鹽州山川紆曲際遐荒萬國華夷入混茫草木不生枯燥地風雲長慘戰爭場雨餘千嶂添秋色塵定孤城下夕陽感慨征人太辛苦東山詩就鬢毛蒼四月望日途中大風慘淡乾坤震鼓􅎏飛沙轉石捲雲霓山川道路俱難辨南北東西一向迷聲浩浩時霾雨落色蒼蒼處玉蟾低四更力少猶吹蕩催上征鞍驟馬蹄過天井關雲冷風髙天井關太行嶺上看河灣九州占絶中原地一塹攔回左界山王霸分爭圖未捲英雄鏖戰血猶殷華陽春草年年緑汙馬南來不放間關外感秋二首白露為霜隂始凝挽回春律果誰能只宜緘口人間事未解含情客裏僧黑水浪濤方括括南山氣象愈稜稜草枯葉脫西風徑正看掀飛掣臂鷹一岩幽隱幾時還猿鶴蕭條蕙帳間畫餅功名誰得飽浮雲富貴此堪攀歸禽側畔千章木行客前頭萬疊山不道世人無定分本圖何事鬢毛班宜陽道中一架飛梁映霽虹玉流通灌稻畦中煙雲忽鎖山川好城郭新修市井空逺樹深深人出沒長空淡淡鳥西東季鷹不憶蓴鱸美萬里秋風又轉蓬龍德城上風還壠麥掉青旗煙斂人家住翠微緑水歌殘山落落碧雲望斷樹依依一封鄉里書才到三月天涯客未歸燕子銜將春色去遊蜂空趂落花飛六盤會仲一飲青雲自笑誤歸期回首關山滿别離禮樂詩書君負苦東西南北我成癡碧梧一葉秋風起銀竹千林春雨垂塞下相逢一杯酒貴傾肝膽略無疑宿河西沙陀黃雲山外接黃埃歸路漫漫沒草萊馬上彎弧皆尚勇機頭織錦孰憐才星珠千顆撒銀漢月鏡半圓橫玉臺寂寞沙陀逢七夕西風瀟瑟夢中來春興花滿樽前酒滿巵春風桃李噴開時醉中忘卻三春夢醒後吟成七字詩大地豈無騏驥路髙梧元有鳳凰枝間人不為功名鄙幽事相關未暇思闕樹鎖蒼煙白鳥嗚春風花滿鳳凰城無才難料人間事有酒何求紙上名分别是非誰得正摩婆今古自宜平間愁枉壓眉頭重且放襟懷伴麴生青樓歌舞碧城春王謝風流日鬭新落下殘花猶殢客墦間餘酒也狂人無田易佩蘇秦印有扇難遮庾亮塵白晝錦衣多睥睨一鄽何處不安貧三冬蟄物聽雷驚二月餘寒尚旅亭春色未歸桃李樹劒光空射斗牛星待船客子思同濟沽酒人家寃獨醒一曲滄浪洗煙雨汨羅江上楚山青東君號令忽傳新一點陽和處處勻白玉花殘梅過臘黃金條嫩栁回春鴈離湘浦獨淹客鶯囀皇州巳可人睡殺海棠吹不醒風前桃李看精神藏春集卷三
