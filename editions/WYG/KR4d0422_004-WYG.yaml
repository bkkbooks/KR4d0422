body:
  text: 藏春集卷四元劉秉忠撰七言絕句遣懷靜守窮廬事不侵閒中一日抵千金傍人自任多評論此是寥休道者心曉行向曉春風暖更清殘星和月落孤城金烏飛上扶桑樹先是東方一片明中秋月月宫丹桂影婆娑簾捲珠樓讌素娥縱有開元遺譜在人間難覔紫雲歌過界牆地老天荒雪亦蒼車頭軋軋轉羊腸短衣蓬鬢沙陀路一嵗三畨過界牆有懷遂長老十一首香火僧齋闕靜縁黄塵導路又三年故人不似青山色擡起頭來在眼前小院桃花晝掩扉東風輭輭日遲遲兩鄉莫恨闗山隔自是人生有别離東園花栁照青春野客閒陪賞翫人望見城南山色好卻囘騎馬入紅塵掃地焚香應接餘翠雲盤結滿窮廬閒人不解謀生事翻過牀頭幾册書雨過幽庭長綠苔東風時為掃塵埃無人曾見春來處門外桃花只自開河漢西流斗柄横爐烟飛動月華清陽春不恨無人和靜裏歌來只自聽山疊崔嵬水渺茫故人萬里未相忘飄零更借天邊鴈獨駕秋風不入行孤城寒角噎南樓黄葉闗山過鴈秋憶起滹沱相别處一窻風雨夢西州軒外夭桃手自栽卧看花落與花開有人來問西來意笑指蒼烟惹緑苔堂上笙歌醉耳紅牡丹香散一簾風謝家鸚鵡金籠裏笑殺池邊綠繼翁半生鞍馬逐風塵鏡裏流年白髪新自是功名有歸處等閒不肯逐閒人讀遺山詩十首劍氣從教犯斗牛百川横放海難收九天直上無凝滯更看銀河一𣲖流鶴揚清唳過華亭銀漢無聲轉玉繩夢斷一軒明月在令人心似玉壺氷編排一字有髙卑就者功夫作者知自古文章貴辭達蘇黄意不在新竒公論元無擅否臧過情聲聞可承當杜詩韓筆難書字不待人言自發揚北里笙歌勸酒杯南隣門巷冷如灰秋風萬里方揺落呌殺孤鴻春不囘青雲髙興入冥搜一字非工未肯休直到雪消冰泮後百川春水自東流情發聲調節作文温柔敦厚見詩真離騷九變能堪尚屈宋前頭更有人兩岸桃花夾醉鄉春江渺渺月茫茫諸仙詩思難籠罩仰羨雲霄孤鳳凰秋風夜雨布衣單破屋猶憂天下寒不料世人多莽鹵久教吾道屬艱難雲霞閃爍動霓旌轟磕征鼙震地聲千里折衝歸指畫將壇孫子獨論兵三月背隂花木錦成叢幽谷鶯啼上苑中李白桃紅楊栁綠天涯無處不春風續山谷焚香險心萬仞晝冥冥躁欲紛紛動五兵誰會焚香黄魯直出門一笑大江横癡坐青春縁底忙忙去白髪無端續續生自笑行藏多錯料卻將癡坐學忘情淡中瀟瀟洒洒水雲鄉擾擾膠膠名利場世味覺來真嚼蠟澹中服過味如糖夏夜天星不見黑雲垂一夜轟雷雨雪飛睡起隂雲寒栗烈夏衣猶自是冬衣夢囘心上無塵世上仙北軒髙挂自由眠正當午夢醒時節竹裏棊聲到枕邊春思江梅零落玉枝空草草花花上苑中桃李不言春不管緑情紅思滿東風留燕銜泥舊燕壘新巢來往如辭曲折勞蝸舎雖微足容爾畫梁爭得幾多髙暮春百花眼底亂飄零緑滿池塘草又生絕色海棠春也妬况他風雨本無情齋中閒來長把自心平寸地人間萬事萌好惡自先欺不得休論暗室有神明為宋義甫言書三首轉腕不圓焉解草立毫未正漫為真須因規矩忘規矩才得縱横似古人書法晉人多得妙右軍筆陣獨縱横鵝頭轉處無凝滯一段風流老更成張君筆法入神趣顛草翻藏古篆風枯樹晩鴉棲未遍忽看雲海起羣鴻感興九首千羽無由息戰爭讀書空有未忘情倐然獨坐穹廬裏安得人心自太平人間萬事不能周自省無虧豈有憂聞道春風和氣裏大家都好展眉頭殘星落盡東方明夜氣消沈萬事生誰信道人心似水無時無節不澄清敬防暴慢禮防身横逆來加莫要嗔萬物分明偹於我儻能克己自歸仁河横斗轉三更夜秋月亭亭影未斜一段光明如許大等閒休遣亂雲遮百年身世寄蘧廬萬事無心自破除一炷古香清靄裏靜來重展案頭書善無不顯惡難藏天網恢恢有弛張牙齒落殘舌尚在誰知柔弱勝剛强元精不逐物虛盈天地誰能踐此形萬物凋枯嵗寒後庭前松栢只青青周流元氣不嘗停晝夜相推有晦明一屈一伸天地理銀蟾西沒日東生歸來鞍馬生平談笑間歸來贏得鬢毛斑紅塵只在南窻外收得身心一榻閒春曉海棠微露濕胭脂楊栁輕風弄碧絲一片春光都是恨佳人睡起倚樓時秋望白沙汀渚近漁村蘋蓼花邊鷗鷺羣老鶴得秋猶勁健九皋飛起入青雲過田家栁映長堤水浸沙夏初騎馬過田家鳴鳩喚住西山雨桑葉如雲麥始花春望濛濛小雨浥芳塵一片花光眼底新山色隔烟無忽有故教凝佇倚樓人山洞桃花山村路僻客來稀紅杏梢頭掛酒旗洞裏桃花人不見春心春色只春知新開牡丹四月新來三月還一春光景鏡中看東風也逐情濃處吹落桃花放牡丹雨過登樓錦里春光曉望中雨餘花潤草蒙茸青山尙在浮烟裏樓上分明見幾峰宫中曲簾捲東風户半開閒庭烟鎻緑紋苔海棠花上黄昏月曾照金鸞幾度來駞車行駞頂丁當響巨鈴萬重軋軋一齊鳴當年不離沙陀地輾斷金原皷笛聲送竇先生因所借陶詩為贐養老須開十頃地求凰應長九苞兒莫還兩冊淵明集便當今朝送别詩小溪小溪流水碧如油終日忘機羨白鷗兩岸桃花春色裏可能容個釣魚舟憶遂通長老三首年來癡坐百無為絕體𤣥㣲卻自㣲此意塞鴻傳不到黄爐青縷漫南飛去年抵枕過三冬别後闗河邈萬重桃李多花易零落青青羨殺嵗寒松一半佳山未見分平生行止不堪云又逢明月當三五滿眼清光似對君為大覺中言詩四首水平忽有驚人浪蓋是因風擊起來造語若能知此意不須特地騁竒才七情六義一心中言語還因感處通李杜蘇黄無二律後生徒苦立家風清雄騷雅因題賦古律篇章逐變生一字莫教無下落有情還似不能情四時迭運方成嵗萬物交參始是文須信乾坤常肅靜龍吟虎嘯自風雲晚眺長歌短詠流年裏逺眺登髙夕照邊不見南山真面目一川秋水淡林烟晴望樓頭凝眺倚晴暉山勢長林水附堤燕子雙雙銜不遍鳳凰城裏落花泥期飲天上日迴牛女度人間春滿鳳凰城謫仙不飲杯中醁閒殺花前好月明溪上蘆花逺映釣舟行漁笛時聞三兩聲一陣西風吹雨散夕陽還在水邊明春睡桃李爭開眼倦開十分春睡若嬰孩每於濃處嗔人喚恐礙周公入夢來訪處士不遇二首山水分明圖畫展烟霞散倒洞湖開何須更見幽人面覽此還家不漫來漁舟散去釣綸收一片殘陽在樹頭誰與騷人消逺思倚樓獨自看川流山林鐘鼎於人殊不惡山林在我固當然東風掃盡庭前雪芳草青青又一年年來本存實志閒終老卻被虚名誤半生甚喜年來得書看小齋清洒紙窻明行中小憩水邊下馬憩斯須從者相催急又趨自笑不如灘上鳥飛來飛去只由渠寄中山乾明寺主十年朔漠走風塵今日乾明伴水雲長老周旋待賓客僧中也有孟嘗君寄長安友人梧桐葉盡菊花殘賴有青松保嵗寒騷客題詩滿河朔可無一句到長安詠海印居士幽居四首東西院映千竿竹南北池開萬朶蓮人在丹青圖畫上不勞雲海覔神仙草枯不整登山屐蓮盡空閒泛水舟旋撥瓮頭新熟酒淵明醉倒菊花秋嚴冬無色物歸根凍栁枯荷各任真紅翠許多何處去翁言今巳屬藏春春日鶯啼緑楊樹夏天人賞白蓮花請君試自南頭數城市山林第一家清明後一日過懷來居庸春色限燕臺山杏凝寒花未開驛馬蕭蕭雲日晚一川風雨過懷來近詩詩如雜劇要鋪陳逺自生疎近自新本欲出塲無好絕等閒章句笑翻人魯連不受賞魯連談笑卻三軍玉璧冰壺不受塵一葉扁舟滄海濶千金留與市㕓人諸葛親細務中持大體取英豪邊幅紛紛有六曹萬里經綸談笑了區區蜀國豈須勞卧龍廬風雨南陽一草廬不知容得幾江湖九層淵底驪龍睡任有人窺頷下珠赤壁故事三分漢鼎勢全張未悟曹公獨渺茫赤壁風濤千載後只教勲業屬周郎讀洛神賦八斗竒才筆力雄洛神一賦盡為功當時羅襪生塵處猶有波紋起細風閒書千里家山入寸眸碧天無際月横鈎書成得得秋風夜一線㣲鴻獨倚樓春深新染薔薇一撲黄梨花亂舞白霓裳憑誰收拾春風去催發酴醿滿架香馬上七夕二首醉眠野鳥三呼起老雨西風一掃空馬上賦詩秋七夕碧天無際思無窮香盤綵帳蛛絲網嵗嵗年年七夕同何處巧成樓上女玉鈎簾幕捲秋風桃花曲紅錦濯來一片新武林溪上照青春世間都唱桃花曲誰是桃花洞裏人桃花落溪上夭桃春巳過劉郎漸老奈花何狂風向晩休生惡枝上殘紅苦不多海棠曲翠氅紅粧色正新精神占斷滿園春東風莫恠長耽睡吹得醒來更誤人城西遊昨朝信馬鳳城西鞭約垂楊過小堤春色滿園花勝錦黄鸝只揀好枝啼月宫謠洞裏桃花不獨春劉郎才去阮郎新廣寒宫裏姮娥住空惜娉婷不嫁人紅葉流霜落嚴秋錦樹空𤨏窻幽思滿西風金河本是無情水流出宫中一葉紅倚樓吟獨上髙樓晩不歸碧空望斷鴈猶飛欄干十二無凭處靜倚東軒待月輝征西囘春囘三月過西州芳草青青不斷頭多少凍溪凝住水盡隨歸客向東流詠闗雎佳人窈窕花難比才子温和玉不如紅日轉西家事緩碧紗窻下詠闗雎鳲鳩詞春風吹翅樹頭鳴呌散浮雲日色晴呼婦歸來鵲巢裏鳲鳩元不解謀生逺别離霜落江寒鴻鴈稀倚樓人定怨歸遲笛聲喚起山頭月飛上青天照别離睡蝴蝶芳草連山翠萬重天涯何處不春風玉蝴蝶在深花裏想與莊周夢不同憶友禁漏遲遲夜未分對床清話不生塵别來幾度西窻下風雨瀟瀟憶故人客館客館蕭條動客情飛螢箇箇傍窻明樓頭鼓角風吹斷漏下銀壺第一聲春始來三月南州草木長落花飛絮滿池塘東君也惜天涯客盡放春光過界牆禪頌十首如來妙法離文字萬語千言何處歸鹿苑秪園空浩浩囘頭四十九年非頂圓肩坦腹中花老大維摩不出家玉鏡金針休補綴十方世界一袈裟鏡中影像元非我石上精神郤是誰落盡桃花春不管枝頭青子自纍纍衲子家風不外求何須苦鬭快龍舟許來大小如來藏堅得俱低一指頭見色明心方是暗聞聲悟道轉為遲斷頭船子無牽緒自在滄浪東復西驢頭馬面誰分别雕觜魚腮孰忖量諱郤舊名人不識長沙元是舊三郎禪榻夢囘三丈日香爐烟裊一絲風東家喃喃西家黙都在去來大藏中倚棹乍離楊栁岸䇿笻又過杏花村水聲禽語相和應說盡觀音不二門春風展葉橋頭栁臘月開花水畔梅萬事隨縁真省力何須心地冷如灰朝雲暮月齋簷底春水秋山拄杖邊自任閒行與閒坐年來忘盡祖師禪古燕感懷虎擲風拏感壯懷英雄遺恨化塵埃燕山依舊青如染佇望黄金布隗臺焚勝梅香春風吹滅小檠缸夢斷爐香結翠幢簷外杏花横素月恰如梅影在西窻薔薇漫與東風作主人栽培花草伴閒身不辭接竹成髙架收拾薔薇一片春洛川洛川東邑幾時歸漾漾清流照翠㣲日暖雪消沙岸輭鴛鴦相對不驚飛宿寒山寺樓上鳴鐘報五更朦朧深殿佛燈明更無幽夢隨寒枕聽徹松風到岸聲溪上溪上映人楊栁黄滿溪流水碧泱泱憑君莫向溪南望春草春風能斷腸素帳山為屏帳草為茵車馬縱横動塞塵過客逺看霜一㸃豈知中有讀書人亭帳草色如波照碧空新開一朶玉芙蓉雄風吹斷襄王夢髙捲巫山十二峰馬酮青樓歌酒少年郎費盡千金笑一場玉釀飲來甘似醴羨伊不肯使人强聞笳霜天月夜鴈南歸塞上誰將捲葉吹莫逐西風聲斷續天涯逺客不勝悲鳳來儀之日賀清朝一返丹山信息遙倘使而今有歸意闕小戎非是七香車逺山仙娥初試鏡中粧左翠㣲濃右翠長應是無人愛平淡不須重問畫眉郎秋月夢囘殘影來窻上日落清光墮馬前一片可將方鏡比照來照去巳三年東勝道中天荒地老物消磨贏得詩人感慨多兩鬢黄塵秋色裏又投東勝過黄河讀易人常與易不相離著意求言轉見疑動靜旣萌爻象具此情明得是蓍龜學道收心學道造精㣲急著工夫巳是遲寡過誰如蘧伯玉囘頭四十九年非偶得人之有善與誰行不善休忘教誨情責備百中無一二聰明都是不聰明夜雨接地隂雲晩不開故鄉歸夢到邢臺枕邊忽聽雷聲起風雨摐摐一發來棋棋盤十九路縱横百著皆從一著生黑白自持心有亂不如袖手看輸贏寄温子玉聰明天賦不能求求得聰明一世愁留得三分不曉事禪房深處咽饅頭桃枝曲一色桃花十里春劉郎見日尚精神東風吹入西家去猶寄芳心憶故人藏春集卷四
