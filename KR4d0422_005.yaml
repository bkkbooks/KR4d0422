body:
  text: 藏春集卷五元劉秉忠撰樂府木蘭花慢到閒人閒處更何必問窮通但遣興哦詩洗心觀易散步攜笻浮雲不堪攀慕看長空淡淡沒孤鴻今古漁樵話裏江山水墨圖中千年事業一朝空春夢曉聞鐘得史筆標名雲臺畫像多少成功歸來富春山下笑狂奴何事傲三公塵事休隨夜雨扁舟好待秋風二既天生萬物自隨分有安排看鸑鷟雲霄驊騮道路斥鷃蒿萊東君更相料理著春風吹處百花開戰馬頻投北望賓鴻又自南來紫垣星月隔塵埃千載拆中台歎麟出非時鳳歸何日草滿金臺江山閲人多矣計古來英物總沈埋鏡裏不堪看鬢樽前且好開懷三笑平生活計渺浮海一虛舟任紫塞風沙烏蠻瘴霧即處林丘天地幾畨朝暮問夕陽無語水東流白首王家年少夢魂正繞揚州鳳城歌舞酒家樓肯管世間愁奈麋鹿疏情烟霞痼疾難與同遊桃花為春憔悴念劉郎雙鬢也成秋舊事十年夜雨不堪重到心頭風流子書帙省淹留人間事一笑不須愁紅日半窗夢隨胡蝶碧雲千里歸驟驊騮酒杯裏功名渾瑣瑣今古兩悠悠漢代典刑蕭曹畫一晉朝人物王謝風流冠蓋照神州春風弄絲竹勝處追遊詩興筆搖牙管字字銀鈎遇美景良辰尋芳上苑賞心樂事取醉南樓好在五湖烟浪誰識歸舟永遇樂山谷家風蕭閒情味只君能識會友論文哦詩遣興此樂誰消得室中天地目前今古今日還明日似南華蝶夢醒來秋雨數聲殘滴詩書有味功名應小雲散碧空幽寂北海洪樽南山佳氣清賞今猶昔一天明月幾行征鴈樓上有人橫笛想醉中八表神遊不勞鳳翼望月婆羅門引春眠正美覺來風雨滿江樓捲簾情思悠悠望斷沙烟渚蘋蓼不勝秋但冥冥天際難識歸舟大夫骨朽算空把汨羅投誰辨濁涇清渭一任東流而今不醉苦一日醒醒一日愁薄薄酒且放眉頭二年來懶看古今文字紙千張酒中悟得天常閒殺階前好月不肯照西廂任昏昏一醉石枕藤牀名途利場物與我兩相忘目斷霜天鴻鴈沙漠牛羊一庭秋草教粉蝶黃蜂自任忙花老也尚有餘香洞仙歌倉陳五斗價重珠千斛陶令家貧苦無畜倦折腰閭里棄印歸來門外栁春至無言緑山明水秀清勝宜茅屋二頃田園一生足樂琴書雅意無箇事卧看北窗松竹忽清風吹夢破鴻荒愛滿院秋香數叢黃菊江城子平生行止懶編排佳蒿萊走塵埃社燕秋鴻年去復年來看盡好花春睡穩紅與紫任他開紫微天上列三台問英才幾沈埋滄海遺珠當著在鸞臺與世浮沈惟酒可如有酒且開懷二逰瓊華島瓊華昔日賀新成與蒼生樂升平西望長山東顧限滄溟翠輦不來人換世天上月自虛盈樹分殘照水邊明雨初晴氣還清醉卻興亡惟有酒多情收取晉人腮上淚千載後幾新亭三松蒼竹翠嵗寒天鴈山前鳳城邊回首燕南一别又三年長愛故人心似月人不見月還圓小窗寂寂鎖凝烟一燈然一詩聯詩苦燈青孤影伴無眠明日酒中餘思在揮醉墨灑雲箋三奠子念我行藏有命烟水無涯嗟去鴈羡歸鴉半生人纍影一事鬢生華東山客西蜀道且還家壺中日月洞裏烟霞春不老景長嘉功名眉上鎖富貴眼前花三杯酒一覺睡一甌茶玉樓春閒雲不肯狂馳騁向晚自來樓嶽頂野人無事也關門一炷古香焚小鼎驚烏有恨無人省飛去飛來明月影夜闌萬籟寂中聞破牗透風微覺冷二翠微掩映農家住水滿玉溪花滿樹青山隨我入門來黃鳥背人穿竹去烟霞隔斷紅塵路試問功名知此趣一壺春酒醉春風便是太平無事處臨江仙同是天涯流落客君還先到襄城雲南關險夢猶驚曾記明月底髙枕逺江聲年去年來人漸老不堪苦思功名傾開懷抱酒多情幾時同一醉揮手謝公卿二滿路紅塵飛不去春風弄我華顛故園桃李酒樽前賞心逢美景此事古難全若智若癡人總笑夕陽空裊吟鞭馬頭山色翠相連不知山下客何日是歸年三堂上簫韶人不奏鳳凰何處飛鳴黃塵擾擾馬縱橫誰能知樂毅志不在齊城後輩漫搜前輩錯到頭義重功輕海隅四向盡蒼生東風吹緑草布谷勸春耕四梨花冰雪飢膚香韻細月明獨倚闌干遊絲縈惹宿烟環東風吹不散應為護輕寒素質不宜添彩色定知造物非慳杏花才思入凋殘玉容春寂寞休向雨中看五桃花一别仙源無覔處劉郎鬢欲成絲蘭昌千樹碧參差芳心應好在時復問蜂兒報道洞門長閉著只今未有開時杏花容冶沒人司東家深院宇牆外有橫枝六海棠十日狂風才是定滿園桃李紛紛黃蜂粉蝶莫生嗔海棠貪睡著留得一枝春便是徐熙相對染丹青不到天真雨餘紅色愈精神夜眠清早起應有惜花人小重山詩酒休驚誤一生黃塵南北路幾功名枝頭烏鵲夢頻驚西州月夜夜照人明枕上數寒更西風殘漏滴雨三聲客中新感故園情音書斷天曉鴈孤鳴二雲去風來雨乍晴斷烟分逺樹夕陽明夕陽無處鴈斜橫山重疊山外更人行千古短長亭别離渾是苦奈西征欲憑雙鯉寄幽情東風水幾日到襄城三曉起清愁酒益空清愁緣底事别離中登臨無地與君同青山色山外更重重落盡海棠紅薔薇新破蕚露華濃牡丹芳信一簾風尋幽夢曾到小園東四漠北雲南路九千舊年鞍上馬又新年玉梅寂寞老江邊東風軟楊栁得春先斜月照吟鞭可人難似月缺還圓桃花流水杏花天歡娛地誰鬭酒樽前五一片殘陽樹上明百禽爭啅噪雨初晴西風鴻鴈落沙汀歸舟逺漁笛兩三聲烟草逐人行前山青未了後山橫山川人物鬭崢嶸黃塵路鞍馬笑平生江月晃重山芳草洲前道路夕陽樓上欄干碧雲何處望歸鞍從軍客耽樂不思還洞裏仙人種玉江邊楚客滋蘭鴛鴦沙暖鶺鴒寒菱花鏡不奈鬢毛班二杜宇聲中去住蝸牛角上輸贏金瓶名字儘人爭秋鴻影湖水鏡般明楊栁烟凝露重蓮花月冷風清萬年枝穩鵲休驚鄰家笛夜夜故園情三太白詩成對酒仲宣賦就登樓思鄉懷古兩悠悠黃塵路風雨鬢驚秋三島雲隨鶴馭五湖月載歸舟青山西塞水東流功名好歡伯笑人愁四紅雨斜斜作陳緑雲碎碎成堆武陵溪口幾人迷桃花水流入不流回夏日薰風殿閣秋宵寶月樓臺仙凡境界隔塵埃青鸞客歸去又歸來南鄉子南北短長亭行路無情客有情年去年來鞍上馬何成短鬢垂垂雪幾莖孤舍一檠燈夜夜看書夜夜明窗外幾竿君子竹凄清時作西風散雨聲二翠䄂捧離觴濟楚兒郎窈窕娘别曲一聲雙淚落悲凉縱不關情也斷腸今古利名忙誰信長安道路長昔日去家年正少還鄉故國驚嗟兩鬢霜三憔悴寄西州賦得登樓懶上樓魂夢不知關塞逺悠悠疏雨梧桐客裏秋往事起新愁九曲回腸不自由見說世間離别苦休休一夜相思白了頭四遊子繞天涯才離蠻烟烟塞沙嵗嵗年年寒食裏無家尚惜飄零看落花閒客卧烟霞應笑勞生鬢早華驚破石泉槐火夢啼鴉掃地焚香自煮茶五李杜放詩豪萬丈晴虹吸海濤六義不傳風雅變離騷金玉無言價自髙春日對春醪短詠長歌慰寂寥幽鳥落來花裏語從教彩鳳飄飄上九霄六季子解縱橫六印纍纍拜上卿鳳鳥不來人漸老謀生二頃田園也易成樽酒醉淵明菊有幽香竹有聲吹破北窗千古夢風清古鳥喧啾噪曉晴七夜户喜凉飈秋入關山暑氣消勾引客情緣底物鷦鷯落日凄清呌樹梢古寺漏長宵一㸃青燈照寂寥暮雨夜深猶未住芭蕉殘葉蕭疏不奈敲八檀板稱歌喉唱到消魂韻轉幽便覺絲簧難比似風流一串驪珠不斷頭惟酒可忘憂况復盧家有莫愁醉倒不知天早晚雲收花影侵窗月滿樓鷓鴣天垂栁風邊拂萬絲春光照眼惜花枝鳳城好景誰來賞忙殺悠悠世上兒歌近耳酒盈巵十分勸飲卻推辭人生休聽漁家曲一日風波十二時二酒酌花開對月明醒中醉了醉中醒無花無酒仍無月愁殺耽詩杜少陵三品貴一時名衆人爭處不須爭流行坎止何憂喜笑泣窮途阮步兵三花滿樽前酒滿巵不開笑口是癡兒山林鐘鼎都休問且聽雙蛾合一詞春爛處夜晴時玉壺香雪冷胭脂海棠影轉梧桐月吟到梨花第一枝四清夜哦詩對月明詩魂偏向月邊清欲成小夢還驚破無奈洋河聒枕聲紅日曉碧天晴風沙撲面過雞鳴㶟陽川裏魚龍混四海青山拱一城五水滿清溪月滿樓客懷須賴酒消愁風回玉宇三更夜露滴金莖八月秋情脉脉思悠悠星河織女隔牽牛乘槎欲把仙郎問也似浮生有白頭六栁映清溪漾玉流火榴開罷芰荷秋一聲漁笛烟波上宜著蓑翁泛小舟紅蓼岸白蘋洲閒鷗閒鷺更優游斜陽影裏山偏好獨倚闌干懶下樓七殘月低簷挂玉鈎東風簾幕思如秋夢魂不被楊花攪池面還添翠靨稠紅叱撥翠驊騮青山隱隱水悠悠行人更在青山外不許朝朝不上樓太常引長安三唱曉雞聲誰不被利名驚攬鏡照星星都老卻當年後生山林蒼翠江湖烟景歸去沒人爭休望濯塵纓幾時得滄浪水清二衲衣藤杖是吾緣好歸去舊林泉富貴任爭先總不較諸公著鞭鴈飛汾陽鶴歸華表人事又千年滄海變桑田誰知有壺中洞天三老山憔悴瑣寒雲站路上最傷神破帽鬢沾塵更誰是陽關故人頽波世道浮雲交態一日一畨新無地覔松筠看花草青紅鬭春四桃花流水鱖魚肥青篛笠緑蓑衣風雨不須歸著甚倣人間是非兩肩雲衲一枝笻杖盡日總忘機之子欲何為快來去山猿怪遲五魯仲連當時六國怯强秦使羣䇿日紛紛談笑卻三軍算自古誰如此君一心忠義滿懷冰雪功就便抽身富貴若浮雲本是箇江湖散人六武侯至人視有一如無見義處便相扶三顧出茅廬莫不是先生有圖極危當世覺民斯道佩玉巳心枯遺恨失吞吳真箇是男兒丈夫秦樓月杯休側為君送别城南陌城南陌茸茸芳草萬家春色陽關一曲愁腸結吟鞭斜裊黃昏月黃昏月長安古道洛陽逰客二斜陽暮西風落葉關山路關山路歸鴻巢燕笑人來去我歌一曲君聽取人生聚散如今古如今古湘江秋水渭川春樹三調羮手殘枝莫折離亭栁離亭栁年年春盡為誰消瘦海棠過雨愁紅皺行人駐馬空搔首空搔首秦樓花月鳯城歌酒踏莎行白日無停青山有暮功名兩字將人誤褊懷先著酒澆開放心又被書收住一味閒情十分幽趣夢哦芳草池塘句東風吹徹滿城花無人曾見春來處二碧水東流白雲西去旌旗捲盡西山雨淡烟寒露月黃昏傷懷又似别來處雙眼增明青山如故故人怪我來何暮征鼙聲震五更風夢魂驚散無蹤緒訴衷情山河縈帶九州橫深谷幾為陵千年萬年興廢花月洛陽城圖富貴論功名我無能一壺春酒數首新詩實訴衷情謁金門春寒薄睡起宿酲生惡枕上家山都夢卻東風吹月落留客定知西閣有酒與誰同酌别手臨岐曾記握君心真可託二醪雖薄再四勸君無惡杯到面前須飲卻鶯啼花未落束置功名髙閣兩日三朝留酌緑栁來年無可握春愁憑底託好事近桃李盡飄零風雨更休懷惡細把牡丹遮護怕黃昏吹落平蕪望斷更青山樓外數峰削野鳥不知歸處把行雲隨著二酒醒夢回時小鼎串烟初滅留得瘦梅疏竹弄窗間風月起來幽緒轉清幽幽處更難說一曲竹枝歌罷滿胸懷冰雪清平樂月明風徑花弄窗間影一夜玉壺秋水冷梧葉乍凋金井世間日月如梭人生會少離多籬畔黃花開盡相逢不醉如何二夜來霜重簾外寒風動橫笛樓頭才一弄驚破緑窗幽夢起來情緒如何開門月色猶多照我如常如舊更誰能似姮娥三漁舟橫渡雲淡西山暮岸草汀花誰作主狼籍一江秋雨隨身篛笠蓑衣斜風細雨休歸自任飛來飛去伴他鷗鷺忘機四彩雲盤結何處歌聲噎歌罷彩雲歸絳闕棹下階前明月月華千古分明照人一似無情不道天涯離客夢回愁對三更卜算子曉角才初弄驚覺幽人夢珠壓花梢的的圓春露昨宵重小鼎香浮動閒把新詩誦坐客同嘗碧月團擘破雙飛鳳浣溪沙桃李無言一徑深客愁春恨莫相尋看花酌酒且開襟白雪浩歌真快意朱絃未絶有知音月明千里故人心朝中措贈章仲一衣冠零落暮春花飄捲滿天涯好把中原麟鳳網來祥瑞皇家白雲丹嶂清泉緑樹幾換年華認取隨時達節莫教繫定匏瓜桃花曲一川芳景一壺春酒一襟幽緒今朝好天色又無風無雨水滿清溪花滿樹有閒鷗伴人來去行雲望逾逺更青山無數二青山千里滄波千里白雲千里行程問行客更無窮山水青史功名都半紙念劉郎鬢先如此桃源覔無路對溪花紅紫二茸茸芳草漫漫長路匆匆行李佳人在何許眇雲山千里莫惜千金沽一醉道劉郎不宜憔悴春歸寂寞語恨桃花流水㸃絳唇十載風霜玉關紫塞都遊遍驛途方逺夜雨留孤館燈火青熒莫把吳鉤看歌聲軟酒斟宜淺三盞清愁散二古寺蕭條十年再到經行路舊題新句總是關心處挂起西軒轉覺添幽趣斜陽暮淡烟疏雨濕遍山前樹三客夢初驚雪晴風冷千山曉塞烟沙草又上郵亭道石室蘿龕為我君應掃何時到放懷吟嘯相伴山間老四寂寂朱簾鳳樓人去簫聲住斷腸詩句彩筆無題處花褪殘紅緑滿西城樹衡皋暮客愁何許梅子黃時雨五天上春來滿前芳草迷歸路楚山湘浦朝暮誰雲雨鳳吹初聽認是吹簫侣劉郎去碧桃千樹世外無尋處六梨花立盡黃昏襪塵不到凌波處雪香凝樹懶作陽臺雨一水相懸脉脉難為語情何許向人如訴寂寞臨江渚七梅䇿杖尋芳小溪深雪前村路暗香時度更在清幽處一見氷容便有西湖趣題新句句成梅許折得南枝去八恰破黃昏一彎新月梢梢共玉溪銀永時有香浮動别後清風馥郁添多種如相送未忘珍重巳入幽人夢桃源憶故人桃花亂落如紅雨閃下西城碧樹寂寞瑣窗朱户最是春深處一樽酒盡青山暮樓外輕雲猶度逺水悠悠不住流得年光去藏春集卷五
